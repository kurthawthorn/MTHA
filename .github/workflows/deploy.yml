name: Byg og udgiv prototypen

# Fire måder at starte en udgivelse:
on:
  # 1. Et push til main — når koden ændrer sig
  push:
    branches: [main]

  # 2. Manuelt fra Actions-fanen
  workflow_dispatch:

  # 3. En webhook fra Sanity — når en redaktør trykker Udgiv.
  #    Det er DET led der gør at Lars' arbejde bliver synligt uden at nogen
  #    skal røre en terminal. Opsætning står i sanity/README.md.
  repository_dispatch:
    types: [sanity-udgivelse]

  # 4. Hver nat kl. 04:12. Et sikkerhedsnet: skulle webhooken være slået fra
  #    eller fejle, er indholdet aldrig mere end et døgn gammelt. Skæve
  #    minutter, fordi GitHub er belastet på runde tidspunkter.
  schedule:
    - cron: '12 4 * * *'

# Rettigheder GitHub Pages kræver
permissions:
  contents: read
  pages: write
  id-token: write

# Én udgivelse ad gangen. Et nyt push afbryder ikke en igangværende
# udgivelse, men venter — så vi ikke ender med halve deploys.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  byg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Slå Pages til
        id: pages
        uses: actions/configure-pages@v5

      # Cacher KUN npm-pakker. Cach ALDRIG poc/.astro eller
      # poc/node_modules/.astro: Astro genbruger cachede sider naar
      # kildefilerne er uaendrede, og en aendring i Sanity aendrer ingen fil.
      # Resultatet ville vaere at et Udgiv ikke slog igennem — og bygningen
      # ville melde succes. `npm run build` rydder cachen for at vaere sikker.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: poc/package-lock.json

      # BYGNINGEN RØRER IKKE m-tha.dk. Det er en forudsætning, ikke en
      # optimering.
      #
      # Sitet skal ERSTATTE m-tha.dk. Så længe bygningen hentede noget derfra,
      # kunne det ikke: den dag den gamle side lukker, ville billeder og
      # downloadlinks forsvinde med den. Et site der er afhængigt af det site
      # det skal afløse, kan aldrig gå i luften.
      #
      # Sådan blev de tre trin fjernet:
      #
      #   149 billeder   →  Sanity (sanity/migrer-fotos.mjs). 36 af bygningens
      #                     65 sekunder gik med at hente dem, og 13 blev brugt.
      #   3 PDF'er       →  Sanity (sanity/migrer-dokumenter.mjs). Målt på tre
      #                     kørsler i træk: 7 s, 8 s og 185 s for de samme tre
      #                     filer. Den langsomme kostede en redaktør fire
      #                     minutter, fordi hendes Udgiv stod i kø bag den.
      #   Python         →  ikke længere nødvendig i bygningen.
      #
      # `tools/fetch_assets.py` bliver liggende, men den er nu et HISTORISK
      # værktøj: sådan blev akademiets indhold trukket ud af det gamle site én
      # gang. Den må ikke komme tilbage i dette workflow.
      - name: Installér afhængigheder
        working-directory: poc
        run: npm ci

      # `npm run build` rydder cachen, bygger OG koerer tools/tjek-design.mjs.
      # Tjekket afslutter med fejlkode 1 hvis noget er galt, saa en fejl i
      # kontrast, alt-tekster, overskrifter eller beroeringsmaal stopper
      # udgivelsen frem for at ligge og se paen ud i loggen.
      - name: Byg og tjek
        working-directory: poc
        env:
          # GitHub Pages lægger projekt-repos på /REPO/. Begge værdier kommer
          # fra configure-pages, så det virker også med et eget domæne senere.
          PUBLIC_BASE: ${{ steps.pages.outputs.base_path }}/
          PUBLIC_SITE: ${{ steps.pages.outputs.origin }}
        run: npm run build

      # Astro præfikser selv sine egne aktiver. De hårdkodede links i
      # skabelonerne rettes her — se poc/tools/saet-basissti.mjs.
      - name: Sæt basissti på hårdkodede links
        working-directory: poc
        run: node tools/saet-basissti.mjs dist "${{ steps.pages.outputs.base_path }}/"

      # Tjekket talte før .webp-filer i output, altså de billeder Astro selv
      # havde optimeret fra lokale filer. Nu kommer næsten alle billeder fra
      # Sanitys CDN, som optimerer på sin side — så Astro laver kun 8 filer, og
      # tjekket ville advare på hver eneste bygning.
      #
      # Det der skal måles er derfor, hvor mange billeder siderne HENVISER til.
      # Er Sanity nede, falder tallet igennem gulvet, og det er præcis den fejl
      # der ellers er tavs: siden bygger, den er blot fuld af pladsholdere.
      - name: Tjek at billederne kom med
        working-directory: poc
        run: |
          FRA_SANITY=$(grep -rho 'cdn\.sanity\.io[^" ]*' dist --include='*.html' \
            | sed 's/?.*//' | sort -u | wc -l)
          LOKALE=$(find dist/_astro -name '*.webp' | wc -l)
          echo "Billeder fra Sanity: $FRA_SANITY — optimeret lokalt: $LOKALE"
          if [ "$FRA_SANITY" -lt 100 ]; then
            echo "::warning::Kun $FRA_SANITY billeder fra Sanity — datasættet svarede muligvis ikke, og siden viser pladsholdere."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: poc/dist

  udgiv:
    needs: byg
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
